services:
  env-viewer:
    image: php:8-apache
    ports:
      - "8080:80"
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - TZ=${TZ}
      - DEBUG=${DEBUG}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - API_KEY=${API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      - ./index.php:/var/www/html/index.php:ro
    restart: unless-stopped